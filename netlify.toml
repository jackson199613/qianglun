# Netlify 部署配置
# 纯静态站点：无需构建命令，直接发布仓库根目录
[build]
  publish = "."
  command = ""

# 简单的安全与缓存头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 找不到的路径回到首页（以后做单页应用时有用）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
