# Netlify 部署配置 · 强纶新材中文官网
# 纯静态站点：无需构建命令，直接发布仓库根目录
[build]
  publish = "."
  command = ""

# 安全与通用头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 图片长缓存
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 视频长缓存
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 样式与脚本：文件名不带版本号，必须每次回源校验（ETag 命中则返回 304，几乎不耗流量）
# 否则改版后回访用户会被旧样式卡住最长 7 天
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML 同理
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 收录相关文件
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# 省略 .html 后缀也能访问（/about → /about.html）
# 2026.11.23 检测报告下线
[[redirects]]
  from = "/files/*"
  to = "/404.html"
  status = 404
  force = true

